name: Build Android App

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24
  PNPM_VERSION: 10
  JAVA_VERSION: 17
  NDK_VERSION: "27.0.12077973"
  # sccache 配置
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # 先构建前端，让多个架构任务复用
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-android:
    name: Tauri Android (${{ matrix.arch }})
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
            tauri_target: aarch64
          - arch: armv7
            target: armv7-linux-androideabi
            tauri_target: armv7

    steps:
      - uses: actions/checkout@v4

      # 下载前端构建产物
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # 设置 Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle 缓存（init 之后目录才存在，这里用静态 key + restore-keys 回退）
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-android
          restore-keys: |
            gradle-${{ runner.os }}-

      # Android SDK & NDK 缓存
      - uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      # 设置 Android SDK & NDK
      - uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      # 设置 Node.js + pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/sync-version.js

      # 设置 Rust + Android targets
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # sccache 加速 Rust 编译
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-${{ matrix.target }}
          cache-on-failure: true

      # 设置环境变量
      - name: Set Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      # 初始化 Android 项目
      - name: Init Android project
        run: pnpm exec tauri android init

      # 配置 Android 签名
      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 判断使用正式签名还是自动生成 debug keystore
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "Using release signing key from secrets"
            base64 -d <<< "$ANDROID_KEY_BASE64" > $RUNNER_TEMP/keystore.jks
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            echo "No signing secrets found, generating debug keystore"
            keytool -genkeypair \
              -v \
              -keystore $RUNNER_TEMP/keystore.jks \
              -alias debug \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=CN"
            KEY_ALIAS="debug"
            KEY_PASSWORD="android"
          fi

          # 创建 keystore.properties
          cd src-tauri/gen/android
          cat > keystore.properties << EOF
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF

          # 修改 build.gradle.kts 添加签名配置
          cd app
          sed -i '1s/^/import java.io.FileInputStream\n/' build.gradle.kts
          sed -i '/buildTypes/i\
          signingConfigs {\
              create("release") {\
                  val keystorePropertiesFile = rootProject.file("keystore.properties")\
                  val keystoreProperties = java.util.Properties()\
                  if (keystorePropertiesFile.exists()) {\
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
                  }\
                  keyAlias = keystoreProperties["keyAlias"] as String\
                  keyPassword = keystoreProperties["password"] as String\
                  storeFile = file(keystoreProperties["storeFile"] as String)\
                  storePassword = keystoreProperties["password"] as String\
              }\
          }
          ' build.gradle.kts
          sed -i 's/getByName("release") {/getByName("release") {\n            signingConfig = signingConfigs.getByName("release")/' build.gradle.kts

      # 构建 Android APK
      - name: Build Android
        run: pnpm exec tauri android build --target ${{ matrix.tauri_target }}

      # 上传构建产物
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 7
          if-no-files-found: warn
