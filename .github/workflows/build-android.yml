name: Build Android App

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24
  PNPM_VERSION: 10
  JAVA_VERSION: 21
  # sccache 配置
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # 先构建前端，让多个架构任务复用
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-android:
    name: Tauri Android (${{ matrix.arch }})
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
            tauri_target: aarch64
          - arch: armv7
            target: armv7-linux-androideabi
            tauri_target: armv7

    steps:
      - uses: actions/checkout@v4

      # 下载前端构建产物
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # 设置 Java 21（AGP 8.x 要求）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 设置 Android SDK（会安装 command-line tools）
      - uses: android-actions/setup-android@v3

      # 检测已安装的 NDK 版本并设置环境变量
      - name: Detect NDK version
        run: |
          # 列出已安装的 NDK 版本
          echo "Available NDKs:"
          ls -d "$ANDROID_HOME/ndk/"*/ 2>/dev/null || echo "No NDKs found"

          # 获取第一个可用的 NDK 版本号
          NDK_VER=$(ls -d "$ANDROID_HOME/ndk/"*/ 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)

          if [ -z "$NDK_VER" ]; then
            echo "No NDK found, installing latest..."
            sdkmanager "ndk;latest"
            NDK_VER=$(ls -d "$ANDROID_HOME/ndk/"*/ 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          fi

          if [ -z "$NDK_VER" ]; then
            echo "::error::Failed to find or install any NDK version"
            exit 1
          fi

          echo "Using NDK: $NDK_VER"
          echo "NDK_VERSION=$NDK_VER" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Gradle 缓存
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-android-

      # 设置 Node.js + pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/sync-version.js

      # 设置 Rust + Android targets
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # sccache 加速 Rust 编译
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-${{ matrix.target }}
          cache-on-failure: true

      # 初始化 Android 项目
      - name: Init Android project
        run: pnpm exec tauri android init

      # 确保生成的 build.gradle.kts 使用正确的 NDK 版本
      - name: Patch NDK version in generated project
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            echo "Patching ndkVersion to $NDK_VERSION"
            sed -i "s/ndkVersion = \"[^\"]*\"/ndkVersion = \"$NDK_VERSION\"/" "$GRADLE_FILE"
            echo "--- build.gradle.kts (first 40 lines) ---"
            head -40 "$GRADLE_FILE"
          else
            echo "::warning::build.gradle.kts not found, skipping NDK version patch"
          fi

      # 配置 Android 签名
      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 判断使用正式签名还是自动生成 debug keystore
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "Using release signing key from secrets"
            base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
          else
            echo "No signing secrets found, generating debug keystore"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=CN"
            export KEY_ALIAS="debug"
            export KEY_PASSWORD="android"
          fi

          # 用 node 脚本注入签名配置到 build.gradle.kts
          node scripts/setup-android-signing.js "$RUNNER_TEMP/keystore.jks"
          cat src-tauri/gen/android/keystore.properties
          cat src-tauri/gen/android/app/build.gradle.kts

      # 构建 Android APK
      - name: Build Android
        run: pnpm exec tauri android build --target ${{ matrix.tauri_target }}

      # 上传构建产物
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 7
          if-no-files-found: warn
